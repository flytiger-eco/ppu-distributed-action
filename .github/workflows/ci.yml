name: Action CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: action-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ${{ vars.PPU_TEST_IMAGE }}
  NAMESPACE: ppu-sched
  COMMAND: |
    set -euo pipefail
    test -f /workspace/source/action.yml
    test -f /workspace/source/README.md
    test -d /nas_aisw
    test -d /mnt/wl_nas
    echo "RANK=$RANK NODE_RANK=$NODE_RANK WORLD_SIZE=$WORLD_SIZE NNODES=$NNODES NPROC_PER_NODE=$NPROC_PER_NODE"
    ppu-smi
    sleep 30

jobs:
  validate:
    name: Validate composite action
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate action metadata
        shell: bash
        run: |
          ruby <<'RUBY'
          require "yaml"

          metadata = YAML.safe_load(File.read("action.yml"), aliases: true)
          abort "action.yml must define a composite action" unless metadata.dig("runs", "using") == "composite"
          abort "action.yml must define composite steps" unless metadata.dig("runs", "steps").is_a?(Array)

          %w[image command].each do |input|
            abort "#{input} must be a required input" unless metadata.dig("inputs", input, "required") == true
          end
          RUBY

      - name: Check shell syntax
        shell: bash
        run: |
          while IFS= read -r script; do
            echo "Checking ${script}"
            bash -n "$script"
          done < <(git ls-files 'scripts/*.sh' '.github/scripts/*.sh')

      - name: Test resource naming
        shell: bash
        run: |
          set -euo pipefail

          name_one=$(env GITHUB_REPOSITORY_OWNER=flytiger-eco GITHUB_JOB_NAME=train GITHUB_RUN_ID=123456 GITHUB_RUN_ATTEMPT=1 PPU_RUNNER_NAME=runner-a MATRIX_JSON='{"model":"llama"}' bash scripts/job-name.sh)
          name_repeat=$(env GITHUB_REPOSITORY_OWNER=flytiger-eco GITHUB_JOB_NAME=train GITHUB_RUN_ID=123456 GITHUB_RUN_ATTEMPT=1 PPU_RUNNER_NAME=runner-a MATRIX_JSON='{"model":"llama"}' bash scripts/job-name.sh)
          name_other_runner=$(env GITHUB_REPOSITORY_OWNER=flytiger-eco GITHUB_JOB_NAME=train GITHUB_RUN_ID=123456 GITHUB_RUN_ATTEMPT=1 PPU_RUNNER_NAME=runner-b MATRIX_JSON='{"model":"llama"}' bash scripts/job-name.sh)

          [[ "$name_one" == "$name_repeat" ]]
          [[ "$name_one" != "$name_other_runner" ]]
          [[ "$name_one" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?-[a-f0-9]{6}$ ]]
          (( ${#name_one} <= 52 ))

  ppu-basic:
    name: PPU ${{ matrix.scenario }}
    needs: validate
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - scenario: 890P single card
            nnodes: 0
            cards: 1
            board: ZW-M890P
          - scenario: 890P eight cards
            nnodes: 0
            cards: 8
            board: ZW-M890P
          - scenario: 890P two nodes
            nnodes: 2
            cards: 8
            board: ZW-M890P
          - scenario: 810E single card
            nnodes: 0
            cards: 1
            board: OAM-810E
          - scenario: 810E eight cards
            nnodes: 0
            cards: 8
            board: OAM-810E
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    steps:
      - name: Check out action
        uses: actions/checkout@v4

      - name: Verify ${{ matrix.scenario }}
        shell: bash
        env:
          INPUT_NNODES: ${{ matrix.nnodes }}
          INPUT_NPROC_PER_NODE: ${{ matrix.cards }}
          INPUT_NODE_SELECTOR: board-type=${{ matrix.board }}
          INPUT_IMAGE: ${{ env.IMAGE }}
          INPUT_COMMAND: ${{ env.COMMAND }}
          INPUT_NAMESPACE: ${{ env.NAMESPACE }}
          INPUT_DMESG_POLICY: always
          INPUT_TIMEOUT_MINUTES: '10'
          MATRIX_JSON: ${{ toJSON(matrix) }}
          PPU_RUNNER_NAME: ${{ runner.name }}
          GITHUB_JOB_NAME: ${{ github.job }}
        run: bash .github/scripts/run-ppu-test.sh

  ppu-resource-defaults:
    name: Default resources for ${{ matrix.board }}
    needs: ppu-basic
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - board: ZW-M890P
            cpu: 31
            memory_gi: 256
          - board: OAM-810E
            cpu: 11
            memory_gi: 112
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    steps:
      - name: Check out action
        uses: actions/checkout@v4

      - name: Verify default limits
        shell: bash
        env:
          INPUT_NNODES: '0'
          INPUT_NPROC_PER_NODE: '1'
          INPUT_JOB_SUFFIX: resource-${{ matrix.board }}
          INPUT_NODE_SELECTOR: board-type=${{ matrix.board }}
          INPUT_IMAGE: ${{ env.IMAGE }}
          INPUT_NAMESPACE: ${{ env.NAMESPACE }}
          INPUT_DMESG_POLICY: always
          INPUT_TIMEOUT_MINUTES: '10'
          MATRIX_JSON: ${{ toJSON(matrix) }}
          PPU_RUNNER_NAME: ${{ runner.name }}
          GITHUB_JOB_NAME: ${{ github.job }}
          INPUT_COMMAND: |
            ${{ env.COMMAND }}
            python3 - <<'PY'
            from pathlib import Path

            expected_cpu = ${{ matrix.cpu }}
            expected_memory = ${{ matrix.memory_gi }} * 1024**3

            if Path("/sys/fs/cgroup/cpu.max").exists():
                quota, period = Path("/sys/fs/cgroup/cpu.max").read_text().split()
            else:
                quota = Path("/sys/fs/cgroup/cpu/cpu.cfs_quota_us").read_text().strip()
                period = Path("/sys/fs/cgroup/cpu/cpu.cfs_period_us").read_text().strip()
            if quota == "max" or int(quota) / int(period) != expected_cpu:
                raise SystemExit(f"CPU limit mismatch: expected={expected_cpu}, quota={quota}, period={period}")

            if Path("/sys/fs/cgroup/memory.max").exists():
                memory = Path("/sys/fs/cgroup/memory.max").read_text().strip()
            else:
                memory = Path("/sys/fs/cgroup/memory/memory.limit_in_bytes").read_text().strip()
            if memory == "max" or int(memory) != expected_memory:
                raise SystemExit(f"memory limit mismatch: expected={expected_memory}, actual={memory}")
            PY
        run: bash .github/scripts/run-ppu-test.sh

  ppu-gang-block:
    name: Block an unsatisfied 8-node 810E gang
    needs: ppu-resource-defaults
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    steps:
      - name: Check out action
        uses: actions/checkout@v4

      - name: Request eight 810E nodes
        id: gang
        shell: bash
        continue-on-error: true
        env:
          INPUT_NNODES: '8'
          INPUT_NPROC_PER_NODE: '16'
          INPUT_NODE_SELECTOR: board-type=OAM-810E
          INPUT_IMAGE: ${{ env.IMAGE }}
          INPUT_COMMAND: echo 'The blocked gang must not start' && exit 1
          INPUT_NAMESPACE: ${{ env.NAMESPACE }}
          INPUT_DMESG_POLICY: on_failure
          INPUT_TIMEOUT_MINUTES: '3'
          PPU_RUNNER_NAME: ${{ runner.name }}
          GITHUB_JOB_NAME: ${{ github.job }}
        run: bash .github/scripts/run-ppu-test.sh

      - name: Confirm the gang timed out
        shell: bash
        run: test "${{ steps.gang.outcome }}" = failure

  prepare-artifact:
    name: Prepare staging fixture
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build fixture
        shell: bash
        run: |
          mkdir -p test-artifact
          printf 'ppu-action-ci\n' > test-artifact/verify-marker.txt

      - name: Upload fixture
        uses: actions/upload-artifact@v4
        with:
          name: ppu-action-ci-fixture
          path: test-artifact/

  ppu-artifact:
    name: Artifact staging on ${{ matrix.scenario }}
    needs:
      - ppu-gang-block
      - prepare-artifact
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - scenario: one card
            nnodes: 0
            cards: 1
          - scenario: two nodes
            nnodes: 2
            cards: 8
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    steps:
      - name: Check out action
        uses: actions/checkout@v4

      - name: Download fixture
        uses: actions/download-artifact@v4
        with:
          name: ppu-action-ci-fixture
          path: downloaded-artifact/

      - name: Verify source and artifact staging
        shell: bash
        env:
          INPUT_NNODES: ${{ matrix.nnodes }}
          INPUT_NPROC_PER_NODE: ${{ matrix.cards }}
          INPUT_NODE_SELECTOR: board-type=ZW-M890P
          INPUT_IMAGE: ${{ env.IMAGE }}
          INPUT_NAMESPACE: ${{ env.NAMESPACE }}
          INPUT_DMESG_POLICY: always
          INPUT_TIMEOUT_MINUTES: '10'
          ARTIFACT_PATHS: downloaded-artifact
          MATRIX_JSON: ${{ toJSON(matrix) }}
          PPU_RUNNER_NAME: ${{ runner.name }}
          GITHUB_JOB_NAME: ${{ github.job }}
          INPUT_COMMAND: |
            set -euo pipefail
            test -f /workspace/source/action.yml
            test -f /workspace/source/README.md
            test -f /workspace/source/downloaded-artifact/verify-marker.txt
            grep -qx ppu-action-ci /workspace/source/downloaded-artifact/verify-marker.txt
            ppu-smi
        run: bash .github/scripts/run-ppu-test.sh
